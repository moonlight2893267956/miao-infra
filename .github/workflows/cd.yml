name: CD

# 仅 push 到 main 时部署（PR 不触发）
on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 引用 prod 环境：
    #   - SSH_KEY 放 Environment secrets（敏感，日志打码）
    #   - 其余（SSH_HOST/USER/PORT/DEPLOY_PATH）放 Environment variables，用 vars. 读取
    # 可在环境里开启保护规则（如部署前需审批、仅 main 可部署）。
    environment: prod
    steps:
      - name: SSH 登录并部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          script_stop: true
          # 默认 10 分钟。本项目镜像是固定版本 tag，正常情况下 pull 会瞬间完成；
          # 但部署机直连 Docker Hub 不通、需经 clash 代理，实测 132MB 分层 10 分钟
          # 只能拉到 32MB，会触发 "Run Command Timeout" 导致整次部署失败
          #（2026-11-19 连续两次踩到）。这里放宽到 20 分钟作为兜底，
          # 同时下方 pull 已改成只补缺失镜像，正常路径不会走满。
          command_timeout: 20m
          script: |
            set -e
            # 部署目录：优先用 Environment variable SSH_DEPLOY_PATH，否则回退到 $HOME/apps/miao-infra
            DEPLOY_PATH="${{ vars.SSH_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="$HOME/apps/miao-infra"
            fi
            cd "$DEPLOY_PATH"

            # 合并基础 compose 与服务器覆盖（发布非默认端口到 0.0.0.0）
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.server.yml"

            echo ">>> 同步最新代码（丢弃服务器本地未提交改动，保证与 origin/main 一致）"
            # 注意：不能用 `git pull`，一旦服务器工作区有本地修改（如手动 scp 覆盖）
            # 就会 merge 冲突导致整个部署失败。CD 服务器本不应有未提交改动，
            # 因此用 fetch + reset --hard 强制对齐远程。
            git fetch --quiet origin
            git reset --hard "origin/${GITHUB_REF_NAME:-main}"

            echo ">>> docker compose pull（仅补缺失镜像）"
            # 只在本地缺少镜像时才拉取，已存在则跳过（--policy missing）。
            #
            # 为什么不无条件 pull：本项目三个镜像都是固定版本 tag
            # （mysql:8.4 / redis:7-alpine / nacos/nacos-server:v3.2.2），
            # 一旦拉下来就基本不会变；而部署机直连 Docker Hub 不通、必须走 clash 代理，
            # 实测 132MB 分层 10 分钟仅拉到 32MB，无条件 pull 会拖满 command_timeout
            # 使整次部署失败（2026-11-19 连续两次事故）。
            # 叠加 registry-mirrors 已被 Cloudflare 人机校验拦截，慢是常态。
            #
            # --ignore-pull-failures 兜底：即便某个镜像确实缺失且拉取失败，
            # 也继续往下走，由 `up -d` 给出真正有意义的错误，而不是让部署静默中断
            #（2026-11-19 教训：pull 中断导致「git 已更新但容器没重建」，配置改动不生效）。
            if ! $COMPOSE pull --policy missing --ignore-pull-failures; then
              echo "::warning::docker compose pull 失败，将使用本地已有镜像继续部署"
            fi

            echo ">>> docker compose up -d"
            $COMPOSE up -d

            echo ">>> 状态"
            $COMPOSE ps

            # 回收未被引用的旧镜像，释放磁盘（可选，不删 volume）
            docker image prune -f
